name: Android CI

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Replace Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3

      - name: Grant execute permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # 1. Rename APK
      - name: Rename APK
        run: |
          VERSION_NAME="V_1.0.${{ github.run_number }}"
          cd app/build/outputs/apk/debug/
          mv app-debug.apk SMSindia_$VERSION_NAME.apk
          echo "APK_PATH=app/build/outputs/apk/debug/SMSindia_$VERSION_NAME.apk" >> $GITHUB_ENV

      # 2. DELETE OLD RELEASE (The Fix 🛠️)
      # This deletes the 'latest' tag so we never get the "Immutable" error
      - name: Delete existing 'latest' tag/release
        uses: dev-drprasad/delete-tag-and-release@v1.1
        with:
          tag_name: latest
          delete_release: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # 3. CREATE NEW RELEASE
      # We use softprops/action-gh-release because it's very stable for fresh releases
      - name: Create New 'Latest' Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: "Latest Auto-Build (v1.0.${{ github.run_number }})"
          body: "New build generated automatically."
          files: ${{ env.APK_PATH }}
          prerelease: true
          token: ${{ secrets.GITHUB_TOKEN }}
