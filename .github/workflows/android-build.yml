name: Android CI

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Announce
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3

      - name: Grant execute permission for Gradlew
        run: chmod +x gradlew

      # --- AUTO VERSIONING HAPPENS HERE ---
      - name: Build Release APK
        env:
          # This passes the GitHub Run Number (e.g., 50) to Gradle
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew assembleRelease

      # --- Sign the APK ---
      - name: Sign Release APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}
          alias: ${{ secrets.SIGNING_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.SIGNING_STORE_PASSWORD }}
          keyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

      # --- Rename & Notify ---
      - name: Prepare File Info
        run: |
          # Use the Run Number for the filename too
          VERSION_TAG="v1.0.${{ github.run_number }}"
          
          # Get signed file path
          SIGNED_FILE="${{ steps.sign_app.outputs.signedReleaseFile }}"
          NEW_NAME="SMSindia_$VERSION_TAG.apk"
          
          mv "$SIGNED_FILE" "$NEW_NAME"
          
          echo "APK_PATH=$NEW_NAME" >> $GITHUB_ENV
          echo "VERSION_TAG=$VERSION_TAG" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      # Upload to GitHub
      - name: Create Private Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: "Build ${{ env.VERSION_TAG }}"
          files: ${{ env.APK_PATH }}
          token: ${{ secrets.GITHUB_TOKEN }}

      # Send to Telegram
      - name: Send Announcement
        run: |
          CAPTION="🚀 <b>NEW UPDATE AVAILABLE!</b>%0A%0A📦 <b>App:</b> SMS India%0A🏷 <b>Version:</b> ${{ env.VERSION_TAG }}%0A📅 <b>Date:</b> ${{ env.BUILD_DATE }}%0A%0A✨ <b>What's New:</b>%0A• Performance Improved%0A• Auto-Updates Enabled%0A%0A👇 <b>Download & Install Now:</b>"

          curl -v -F "chat_id=${{ secrets.TELEGRAM_TO }}" \
          -F "document=@${{ env.APK_PATH }}" \
          -F "parse_mode=HTML" \
          -F "caption=$CAPTION" \
          https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendDocument
