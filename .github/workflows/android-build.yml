name: Android CI

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# Give permission to create new releases
permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3

      - name: Grant execute permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # 1. Rename APK with Unique Version Number
      - name: Rename APK
        run: |
          # Use Run Number to make filename unique (e.g. SMSindia_v1.0.25.apk)
          VERSION_TAG="v1.0.${{ github.run_number }}"
          
          cd app/build/outputs/apk/debug/
          mv app-debug.apk SMSindia_$VERSION_TAG.apk
          
          # Save path for the next step
          echo "APK_PATH=app/build/outputs/apk/debug/SMSindia_$VERSION_TAG.apk" >> $GITHUB_ENV
          echo "VERSION_TAG=$VERSION_TAG" >> $GITHUB_ENV

      # 2. Create a NEW Release (No deleting, No errors)
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          # This creates a unique tag every time (v1.0.1, v1.0.2, etc.)
          tag_name: ${{ env.VERSION_TAG }}
          name: "Release ${{ env.VERSION_TAG }}"
          body: "New auto-generated build."
          files: ${{ env.APK_PATH }}
          token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: false
