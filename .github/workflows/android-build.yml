name: Android CI

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest
    
    # ⚠️ IMPORTANT: permission to write to Releases
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3

      - name: Grant execute permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # ✅ 1. RENAME STEP (Kept your logic)
      - name: Rename APK
        run: |
          # Create version name
          VERSION_NAME="V_1.0.${{ github.run_number }}"
          
          # Go to folder
          cd app/build/outputs/apk/debug/
          
          # Rename file
          mv app-debug.apk SMSindia_$VERSION_NAME.apk
          
          echo "APK renamed to SMSindia_$VERSION_NAME.apk"

      # ✅ 2. RELEASE STEP (This fixes your issue)
      # This will automatically DELETE the old file in "latest" and upload the NEW one.
      - name: Upload to "Latest" Release
        uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "latest"
          prerelease: true
          title: "Latest Auto-Build (v1.0.${{ github.run_number }})"
          files: |
            app/build/outputs/apk/debug/*.apk
