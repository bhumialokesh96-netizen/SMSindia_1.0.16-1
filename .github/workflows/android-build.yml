name: Android CI

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Announce
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3

      - name: Grant execute permission for Gradlew
        run: chmod +x gradlew

      # --- BUILD ---
      - name: Build Release APK
        run: ./gradlew assembleRelease

      # --- DECODE KEYSTORE (The Safe Way) ---
      - name: Decode Keystore
        id: decode_keystore
        uses: timheuer/base64-to-file@v1.2
        with:
          fileName: 'my-release-key.jks'
          encodedString: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}

      # --- SIGN MANUALLY (Fixes Build Tools Error) ---
      - name: Sign Release APK
        run: |
          # 1. Find the apksigner tool
          ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}
          BUILD_TOOLS_VERSION=$(ls $ANDROID_SDK_ROOT/build-tools | sort -V | tail -n 1)
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION/apksigner"
          
          echo "Using Build Tools: $BUILD_TOOLS_VERSION"
          
          # 2. Define Paths
          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED_APK="app/build/outputs/apk/release/SMSindia_Signed.apk"
          
          # 3. Sign the APK using the decoded file
          $APKSIGNER sign --ks "${{ steps.decode_keystore.outputs.filePath }}" \
            --ks-key-alias "${{ secrets.SIGNING_KEY_ALIAS }}" \
            --ks-pass "pass:${{ secrets.SIGNING_STORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.SIGNING_KEY_PASSWORD }}" \
            --out "$SIGNED_APK" \
            "$UNSIGNED_APK"

      # --- PREPARE & RENAME ---
      - name: Prepare File Info
        run: |
          VERSION_TAG="v1.0.${{ github.run_number }}"
          SIGNED_FILE="app/build/outputs/apk/release/SMSindia_Signed.apk"
          NEW_NAME="SMSindia_$VERSION_TAG.apk"
          
          mv "$SIGNED_FILE" "$NEW_NAME"
          
          echo "APK_PATH=$NEW_NAME" >> $GITHUB_ENV
          echo "VERSION_TAG=$VERSION_TAG" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      # --- UPLOAD TO TELEGRAM ---
      - name: Send Announcement
        run: |
          CAPTION="🚀 <b>NEW UPDATE AVAILABLE!</b>%0A%0A📦 <b>App:</b> SMS India%0A🏷 <b>Version:</b> ${{ env.VERSION_TAG }}%0A📅 <b>Date:</b> ${{ env.BUILD_DATE }}"

          curl -v -F "chat_id=${{ secrets.TELEGRAM_TO }}" \
          -F "document=@${{ env.APK_PATH }}" \
          -F "parse_mode=HTML" \
          -F "caption=$CAPTION" \
          https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendDocument
