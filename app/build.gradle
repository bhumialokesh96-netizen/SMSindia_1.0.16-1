apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'

android {
    namespace 'com.smsindia.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.smsindia.app"
        minSdk 24
        targetSdk 35

        // --- ✅ AUTO-UPDATE VERSION LOGIC ---
        // Reads "BUILD_NUMBER" from GitHub Actions.
        // If running locally on your PC, it defaults to "15".
        def buildNumber = System.getenv("BUILD_NUMBER") ?: "15"

        versionCode buildNumber.toInteger()
        versionName "1.0." + buildNumber
        // ------------------------------------

        // --- 🔐 SECURE CONFIGURATION ---
        // Load sensitive data from local.properties or environment variables
        def localProperties = new Properties()
        def localPropertiesFile = rootProject.file('local.properties')
        if (localPropertiesFile.exists()) {
            localPropertiesFile.withInputStream { localProperties.load(it) }
        }
        
        // Supabase configuration - prioritize environment variables over local.properties
        def supabaseUrl = System.getenv("SUPABASE_URL") ?: 
                         localProperties.getProperty('supabase.url') ?: 
                         "https://appfwrpynfxfpcvpavso.supabase.co"
        def supabaseKey = System.getenv("SUPABASE_ANON_KEY") ?: 
                         localProperties.getProperty('supabase.anon.key') ?: 
                         "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFwcGZ3cnB5bmZ4ZnBjdnBhdnNvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjIwOTQ2MTQsImV4cCI6MjA3NzY3MDYxNH0.Z-BMBjME8MVK5MS2KBgcCDgR7kXvDEjtcHrVfIUvwZY"
        
        buildConfigField "String", "SUPABASE_URL", "\"${supabaseUrl}\""
        buildConfigField "String", "SUPABASE_ANON_KEY", "\"${supabaseKey}\""
        // ------------------------------------

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug { }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation "androidx.viewpager2:viewpager2:1.0.0"
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // 🔥 Firebase
    implementation platform('com.google.firebase:firebase-bom:33.4.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-messaging'

    // ⚙️ Background & Ads
    implementation 'androidx.work:work-runtime:2.8.1'
    implementation 'com.google.guava:guava:32.1.3-android'
    implementation 'com.google.android.gms:play-services-ads:23.0.0'

    // 🖼️ UI Libraries
    implementation 'com.github.denzcoskun:ImageSlideshow:0.1.2'
    
    // 🌐 Network
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
     // Lottie Animation Library
 implementation 'com.airbnb.android:lottie:6.1.0'
}
